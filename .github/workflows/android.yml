name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest :soundhub-core:test

      # SoundHub's permanent signing key, from the repository secret SOUNDHUB_KEYSTORE (a base64
      # keystore). With it every SoundHub build installs over the previous one; without it (forks,
      # or before the secret is added) builds are signed with this machine's throwaway debug key.
      - name: SoundHub signing key
        env:
          SOUNDHUB_KEYSTORE: ${{ secrets.SOUNDHUB_KEYSTORE }}
        run: |
          if [ -n "$SOUNDHUB_KEYSTORE" ]; then
            echo "$SOUNDHUB_KEYSTORE" | base64 -d > "$RUNNER_TEMP/soundhub.p12"
            echo "SOUNDHUB_KEYSTORE_FILE=$RUNNER_TEMP/soundhub.p12" >> "$GITHUB_ENV"
            echo "Using the permanent SoundHub signing key"
          else
            echo "No SOUNDHUB_KEYSTORE secret: SoundHub is signed with a throwaway key"
          fi

      - name: Build APKs
        env:
          SOUNDHUB_KEYSTORE_PASSWORD: ${{ secrets.SOUNDHUB_KEYSTORE_PASSWORD || 'soundhub-key' }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: streamhub-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: soundhub-apks
          path: |
            soundhub/app/build/outputs/apk/debug/*.apk
            soundhub/app/build/outputs/apk/release/*.apk

      # Publishes the APKs as a GitHub Release so they have public links that a TV can open
      # (e.g. in the "Downloader" app). The newest one is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/app-universal-debug.apk
      - name: Publish release
        if: >-
          github.event_name == 'push' &&
          (github.ref_name == github.event.repository.default_branch ||
           github.ref_name == 'claude/stremio-android-tv-app-by6t0b')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: StreamHub build ${{ github.run_number }}
          make_latest: "true"
          body: |
            StreamHub APKs built from ${{ github.sha }} (branch `${{ github.ref_name }}`).

            **Which file?** If unsure, use `app-universal-debug.apk` (works on every device).
            The `armeabi-v7a` / `arm64-v8a` / `x86` / `x86_64` files are smaller builds for one CPU type.

            Direct link to the newest build, e.g. for the Downloader app on Android TV:
            https://github.com/${{ github.repository }}/releases/latest/download/app-universal-debug.apk
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # SoundHub (the music app) gets its own public releases. They never become "latest", so the
      # StreamHub link above keeps pointing at StreamHub.
      - name: Publish SoundHub release
        if: >-
          github.event_name == 'push' &&
          (github.ref_name == github.event.repository.default_branch ||
           github.ref_name == 'claude/soulseek-streaming-atmos-7iyvn7')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: soundhub-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SoundHub build ${{ github.run_number }}
          make_latest: "false"
          # SoundHub's updater shows the "What's new" part (up to the --- line).
          body: |
            ## What's new
            ${{ github.event.head_commit.message }}

            ---
            SoundHub (Soulseek music with Dolby Atmos passthrough) built from ${{ github.sha }} (branch `${{ github.ref_name }}`).

            Install `soundhub-release.apk` (or `soundhub-debug.apk` for troubleshooting). Direct link, e.g. for the Downloader app on Google TV:
            https://github.com/${{ github.repository }}/releases/download/soundhub-build-${{ github.run_number }}/soundhub-release.apk
            Installed SoundHub updates itself from Settings → Updates.
          files: |
            soundhub/app/build/outputs/apk/debug/*.apk
            soundhub/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            soundhub/core/build/reports/tests/
