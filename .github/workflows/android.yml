name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # StreamHub Server (separate build in server/): tests, then the zip people install at home.
      - name: Home server
        run: |
          ./gradlew --no-daemon -p server test distZip
          cp server/build/distributions/streamhub-server-*.zip server/build/distributions/streamhub-server.zip

      # The Linux installer (.deb with its own Java): double-click to install on Ubuntu, Mint, Debian…
      - name: Home server Linux installer
        run: |
          command -v fakeroot || (sudo apt-get update -q && sudo apt-get install -y -q fakeroot)
          ./gradlew --no-daemon -p server linuxInstaller
          cp server/build/installer/out/streamhub-server_*.deb server/build/installer/out/streamhub-server-linux.deb

      # The permanent signing key (secret STREAMHUB_KEYSTORE = base64 of the .jks file, and
      # STREAMHUB_KEYSTORE_PASSWORD). Without it the APKs use a throwaway key, and installing a new
      # build means uninstalling the old one first.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMHUB_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamhub.jks"
            echo "STREAMHUB_KEYSTORE_FILE=$RUNNER_TEMP/streamhub.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::STREAMHUB_KEYSTORE secret is not set; APKs are signed with a throwaway key"
          fi

      - name: Build APKs
        env:
          STREAMHUB_KEYSTORE_PASSWORD: ${{ secrets.STREAMHUB_KEYSTORE_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: streamhub-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Publishes the APKs as a GitHub Release so they have public links that a TV can open
      # (e.g. in the "Downloader" app). The newest one is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/app-universal-debug.apk
      - name: Publish release
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref_name == github.event.repository.default_branch ||
           github.ref_name == 'claude/stremio-android-tv-app-by6t0b')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: StreamHub build ${{ github.run_number }}
          make_latest: "true"
          body: |
            StreamHub build ${{ github.run_number }}, from ${{ github.sha }} (branch `${{ github.ref_name }}`).

            **Which file?** Most Android TVs and boxes: `app-armeabi-v7a-release.apk` (about 17 MB).
            Newer 64-bit devices can use `app-arm64-v8a-release.apk`. `app-universal-release.apk` works
            everywhere but is about 65 MB because it carries the torrent engine for every processor type.

            **Home Server** (downloads for StreamHub while the TV is off): on Windows run
            `streamhub-server-windows.exe` (added a few minutes after the APKs); on a Linux PC (Ubuntu, Mint,
            Debian…) double-click `streamhub-server-linux.deb`. Then open "StreamHub Server" from the Start /
            app menu. On macOS or a NAS use `streamhub-server.zip` (needs Java 17; see README.md inside).

            Newest build, e.g. for the Downloader app on Android TV:
            https://github.com/${{ github.repository }}/releases/latest/download/app-armeabi-v7a-release.apk
          files: |
            app/build/outputs/apk/release/*.apk
            server/build/distributions/streamhub-server.zip
            server/build/installer/out/streamhub-server-linux.deb

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            server/build/reports/tests/

  # The Windows installer for StreamHub Server, built on Windows (jpackage + WiX). The program is
  # started once and checked before it is packed.
  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Windows program
        run: ./gradlew.bat --no-daemon -p server windowsAppImage

      - name: Check that it starts
        shell: pwsh
        run: |
          $exe = "server/build/installer/windows-image/StreamHub Server/StreamHub Server.exe"
          $data = "$env:RUNNER_TEMP\streamhub-data"
          Start-Process -FilePath $exe -ArgumentList "--background", "--data=$data"
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $ok = (Invoke-RestMethod http://127.0.0.1:8095/api/hello).app -eq 'streamhub-server' } catch {}
          }
          Get-Content "$data\server.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "StreamHub Server didn't start" }
          $admin = @{ 'X-StreamHub' = 'admin' }
          # The first start switches on "Start with Windows" (a Startup shortcut) right after starting.
          for ($i = 0; $i -lt 20; $i++) {
            $status = Invoke-RestMethod http://127.0.0.1:8095/admin/api/status -Headers $admin
            if ($status.autostart -eq $true) { break }
            Start-Sleep 2
          }
          $status | ConvertTo-Json
          Get-Content "$data\server.log"
          if ($status.autostart -ne $true) { throw "Start with Windows wasn't switched on" }
          Invoke-RestMethod http://127.0.0.1:8095/admin/api/stop -Method Post -Headers $admin -Body '{}' -ContentType 'application/json'
          Start-Sleep 3

      - name: Windows installer
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon -p server windowsInstaller -x windowsAppImage
          Copy-Item (Get-ChildItem "server/build/installer/out/*.exe" | Select-Object -First 1).FullName server/build/installer/out/streamhub-server-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: streamhub-server-windows
          path: server/build/installer/out/streamhub-server-windows.exe

  # Adds the Windows installer to the release the build job published.
  publish-windows:
    needs: [build, server-windows]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_name == github.event.repository.default_branch ||
       github.ref_name == 'claude/stremio-android-tv-app-by6t0b')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: streamhub-server-windows

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: streamhub-server-windows.exe
