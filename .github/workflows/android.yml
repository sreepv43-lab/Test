name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # StreamHub Server (separate build in server/): tests, then the zip people install at home.
      - name: Home server
        run: |
          ./gradlew --no-daemon -p server test distZip
          cp server/build/distributions/streamhub-server-*.zip server/build/distributions/streamhub-server.zip

      # The Linux installer (.deb with its own Java): double-click to install on Ubuntu, Mint, Debian…
      - name: Home server Linux installer
        run: |
          command -v fakeroot || (sudo apt-get update -q && sudo apt-get install -y -q fakeroot)
          ./gradlew --no-daemon -p server linuxInstaller
          cp server/build/installer/out/streamhub-server_*.deb server/build/installer/out/streamhub-server-linux.deb

      # The permanent signing key (secret STREAMHUB_KEYSTORE = base64 of the .jks file, and
      # STREAMHUB_KEYSTORE_PASSWORD). Without it the APKs use a throwaway key, and installing a new
      # build means uninstalling the old one first.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMHUB_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamhub.jks"
            echo "STREAMHUB_KEYSTORE_FILE=$RUNNER_TEMP/streamhub.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::STREAMHUB_KEYSTORE secret is not set; APKs are signed with a throwaway key"
          fi

      - name: Build APKs
        env:
          STREAMHUB_KEYSTORE_PASSWORD: ${{ secrets.STREAMHUB_KEYSTORE_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: streamhub-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Publishes the APKs as a GitHub Release so they have public links that a TV can open
      # (e.g. in the "Downloader" app). The newest one is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/app-universal-debug.apk
      - name: Publish release
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref_name == github.event.repository.default_branch ||
           github.ref_name == 'claude/stremio-android-tv-app-by6t0b')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: StreamHub build ${{ github.run_number }}
          make_latest: "true"
          body: |
            StreamHub build ${{ github.run_number }}, from ${{ github.sha }} (branch `${{ github.ref_name }}`).

            **Which file?** Most Android TVs and boxes: `app-armeabi-v7a-release.apk` (about 17 MB).
            Newer 64-bit devices can use `app-arm64-v8a-release.apk`. `app-universal-release.apk` works
            everywhere but is about 65 MB because it carries the torrent engine for every processor type.

            **Home Server** (downloads for StreamHub while the TV is off): on a Linux PC (Ubuntu, Mint, Debian…)
            install `streamhub-server-linux.deb` by double-clicking it, then open "StreamHub Server" from the
            app menu. On Windows, macOS or a NAS use `streamhub-server.zip` (needs Java 17; see README.md inside).

            Newest build, e.g. for the Downloader app on Android TV:
            https://github.com/${{ github.repository }}/releases/latest/download/app-armeabi-v7a-release.apk
          files: |
            app/build/outputs/apk/release/*.apk
            server/build/distributions/streamhub-server.zip
            server/build/installer/out/streamhub-server-linux.deb

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            server/build/reports/tests/
